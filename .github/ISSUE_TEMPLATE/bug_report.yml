name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: dropdown
    id: base
    attributes:
      label: Where did it happen?
      options:
        - Obsidian
        - Roam
        - Both
        - The server
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      placeholder: The steps, starting from a fresh vault or graph if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Obsidian 1.15.0, Node 26
