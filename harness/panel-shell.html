<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discourse Graphs panel</title>
<style>
:root { color-scheme: light dark; --ink: #1f2328; --muted: #59636e; --line: #d0d7de; --card: #f6f8fa; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --ink: #e6edf3; --muted: #9198a1; --line: #3d444d; --card: #151b23; --accent: #4493f8; } }
body { margin: 0; padding: 20px; font: 14px/1.5 -apple-system, system-ui, sans-serif; color: var(--ink); background: Canvas; }
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 13px; margin: 20px 0 6px; color: var(--muted); }
p { margin: 4px 0; color: var(--muted); }
ul { margin: 0; padding-left: 18px; }
.canvas { width: 100%; max-width: 760px; height: auto; display: block; }
.card { fill: var(--card); stroke: var(--line); }
.card-text { fill: var(--ink); font-size: 13px; }
.edge { stroke: var(--accent); stroke-width: 1.5; }
.edge-label { fill: var(--accent); font-size: 12px; }
</style>
</head>
<body><p>Connecting to the base…</p><script>/*__PANEL_JS__*/</script></body>
</html>
